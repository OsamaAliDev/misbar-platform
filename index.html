<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBF6EF" />
    <script>
      // Apply stored preferences before CSS/React to avoid a wrong-theme frame.
      (() => {
        const read = key => { try { return JSON.parse(localStorage.getItem(key)); } catch (_) { return null; } };
        const choice = read('misbar:theme:v1'), lang = read('misbar:lang:v1');
        const theme = ['night','light'].includes(choice) ? choice : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'night' ? '#141A2E' : '#FBF6EF';
        document.documentElement.lang = lang === 'en' ? 'en' : 'ar';
        document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
      })();
    </script>
    <meta
      name="description"
      content="مِسبار — مكتبة تجارب علمية ورياضية تفاعلية بالعربية والمنهج المصري للطلاب من ١٠ إلى ١٤ سنة: محاكيات وأبطال ومهام ودروس الصف الرابع."
    />
    <meta name="author" content="Misbar project" />
